<mat-card class="health-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Status da API</mat-card-title>
    <mat-card-subtitle>GET /api/v1/health-check</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="health-card__content">
    @if (loading()) {
      <mat-progress-spinner mode="indeterminate" diameter="40" />
      <span>Consultando…</span>
    } @else if (status(); as s) {
      <p class="health-card__status" data-testid="health-status">
        <mat-icon class="health-card__ok" aria-hidden="true">check_circle</mat-icon>
        <span>status: <strong>{{ s }}</strong></span>
      </p>
    } @else if (error(); as e) {
      <p class="health-card__error" data-testid="health-error">
        <mat-icon aria-hidden="true">error_outline</mat-icon>
        <span>{{ e }}</span>
      </p>
    }
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="check()" [disabled]="loading()">Reconsultar</button>
  </mat-card-actions>
</mat-card>
