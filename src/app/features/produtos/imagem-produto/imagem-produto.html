<!-- Prioridade banco → URL externa → placeholder (SPEC-M3 §3.6, CA-11). -->
@if (fonteBanco(); as src) {
  <img class="vaso__img" [src]="src" [alt]="alt()" loading="lazy" />
} @else if (fonteExterna(); as url) {
  <img
    class="vaso__img"
    [src]="url"
    [alt]="alt()"
    loading="lazy"
    (error)="aoErroUrlExterna()"
  />
} @else {
  <div class="vaso__placeholder" aria-hidden="true">
    <mat-icon>local_florist</mat-icon>
  </div>
}
